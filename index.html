<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Prompt Library</h1>
  </header>

  <main class="app-main">
    <section class="add-prompt">
      <h2>Add a prompt</h2>
      <form id="prompt-form">
        <label for="prompt-title">Title</label>
        <input id="prompt-title" name="title" type="text" required maxlength="120" placeholder="e.g. Blog Outline Generator" />

        <label for="prompt-content">Content</label>
        <textarea id="prompt-content" name="content" required rows="6" placeholder="You are an expert..."></textarea>

        <button type="submit">Add Prompt</button>
      </form>
    </section>

    <section class="prompt-list-section">
      <h2>Prompts</h2>
      <div id="prompt-list" class="prompt-list"></div>
      <p id="empty-state" class="empty-state" hidden>No prompts yet. Add one above to get started.</p>
    </section>
  </main>

  <template id="prompt-card-template">
    <article class="prompt-card" data-prompt-id="">
      <div class="prompt-card-header">
        <h3 class="prompt-title"></h3>
        <button type="button" class="delete-btn" aria-label="Delete prompt">&times;</button>
      </div>
      <p class="prompt-preview"></p>
      <div class="stars" role="group" aria-label="Rating"></div>
      <div class="prompt-actions">
        <button type="button" class="copy-btn">Copy</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
